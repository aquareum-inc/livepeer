# One bundle for local development and self-hosting.
#
#   app only (mock-only mode, no keys needed):   docker compose -f deploy/compose.yaml up -d
#   app + engine + payment provider + signer:    docker compose -f deploy/compose.yaml --profile network up -d
#
# Image names and pins come from the instance's .env, which `livepeer setup` writes from
# release.config.json. INSTANCE_DIR is the directory holding .env and instance.config.json
# (the repository root by default).
# The engine and Clearinghouse Batteries publish no images yet, so each service also carries a
# pinned Git build context; `docker compose pull` is used once images exist, `build` until then.
name: livepeer

# The app and the one-shot migration run from the same image. The database address is the bundle's own Postgres
# unless .env sets DATABASE_URL to another one; it is given here, not written to .env, so the same .env still
# runs `pnpm dev` with no database.
x-app: &app
  image: ${REGISTRY}/${ORG}/livepeer:${APP_VERSION:-local}
  build: { context: .., dockerfile: Dockerfile }
  env_file: [{ path: "${INSTANCE_DIR:-..}/.env", required: true }]

x-database-url: &database-url ${DATABASE_URL:-postgres://livepeer:${POSTGRES_PASSWORD:-}@db:5432/livepeer}

# Where uploaded files go: the bundle's own object storage unless .env names another S3-compatible service
# (S3_ENDPOINT with its bucket, region and key). The bundle's storage has no address outside this network, so
# S3_PUBLIC_ENDPOINT is "app": browsers and phones send a file to the app's own address, which passes it on
# without holding it. Storage named in .env is assumed to be reachable by them directly.
x-storage: &storage
  S3_BUCKET: ${S3_BUCKET:-livepeer-media}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:3900}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT:-app}}
  S3_REGION: ${S3_REGION:-garage}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${STORAGE_ACCESS_KEY_ID:-}}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${STORAGE_SECRET_KEY:-}}

services:
  app:
    <<: *app
    environment:
      <<: *storage
      INSTANCE_CONFIG: /config/instance.config.json
      DATABASE_URL: *database-url
      # Named here because .env carries DATA_DIR empty, which would otherwise replace the image's own value
      # and leave the app nowhere it is allowed to write.
      DATA_DIR: /data
    volumes:
      - ${INSTANCE_DIR:-..}/instance.config.json:/config/instance.config.json:ro
      - app-data:/data
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    # The app starts only on a migrated database and prepared storage: a failure in either stops it here.
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # The instance's own state. No published port: only the app and the migration reach it.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: livepeer
      POSTGRES_DB: livepeer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run ./livepeer setup, which generates it}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U livepeer -d livepeer"], interval: 5s, timeout: 3s, retries: 12 }
    restart: unless-stopped

  # Brings the database to this release's schema, then exits. It runs on every `up`, so setup, upgrade and a
  # plain restart all apply what is pending and nothing else has to remember to.
  migrate:
    <<: *app
    command: [node, migrate.cjs, migrations]
    environment:
      DATABASE_URL: *database-url
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  # The instance's own object storage: Garage, an S3-compatible server, as one node keeping one copy of each
  # file. No published port: the app reaches it, and passes clients' files to and from it. It is run as its
  # maintainers publish it, unmodified, as a separate service (it is AGPL; nothing of it is in this repository).
  storage:
    image: dxflrs/garage:v2.1.0
    environment:
      GARAGE_RPC_SECRET: ${STORAGE_RPC_SECRET:?STORAGE_RPC_SECRET is not set. Run ./livepeer setup, which generates it}
      GARAGE_ADMIN_TOKEN: ${STORAGE_ADMIN_TOKEN:?STORAGE_ADMIN_TOKEN is not set. Run ./livepeer setup, which generates it}
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - storage-data:/var/lib/garage
    restart: unless-stopped

  # Prepares that storage, then exits: the node's layout, the bucket, and the app's key with leave to use it.
  # Like migrate it runs on every `up` and does only what is not yet done. It is the app image because that
  # has Node; the script is the one file mounted here.
  storage-init:
    <<: *app
    command: [node, /storage-init.mjs]
    environment:
      GARAGE_ADMIN_URL: http://storage:3903
      GARAGE_ADMIN_TOKEN: ${STORAGE_ADMIN_TOKEN:-}
      STORAGE_BUCKET: livepeer-media
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
    volumes: [./config/storage-init.mjs:/storage-init.mjs:ro]
    depends_on: { storage: { condition: service_started } }
    restart: "no"

  engine:
    profiles: [network]
    image: ${REGISTRY}/${ORG}/livepeer-engine:${ENGINE_REF}
    build:
      context: https://github.com/${ENGINE_REPO}.git#${ENGINE_REF}
      dockerfile: deploy/dev-stack/engine/Dockerfile
      args: { BUILDKIT_CONTEXT_KEEP_GIT_DIR: "1" }
    env_file: [{ path: network.env, required: false }]
    environment:
      LPB_DATABASE_URL: sqlite+aiosqlite:////data/livepeer-builder.db
      LPB_HTTP_HOST: 0.0.0.0
      LPB_HTTP_PORT: "8080"
      LPB_DISCOVERY_URL: http://discovery:8939/discovery
      LPB_SIGNER_URL: http://clearinghouse:8937
      LPB_BATTERIES_URL: http://clearinghouse:8081
    ports: ["127.0.0.1:${ENGINE_PORT:-8090}:8080"]
    volumes: [engine-data:/data]
    depends_on: [signer]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/livez')"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  discovery:
    profiles: [network]
    image: ${REGISTRY}/${ORG}/livepeer-engine:${ENGINE_REF}
    command: [lpb, discovery]
    environment: { LPD_ORCHESTRATORS: /etc/lpd/orchestrators.txt, LPD_HTTP_HOST: 0.0.0.0 }
    volumes: [./config/orchestrators.txt:/etc/lpd/orchestrators.txt:ro]
    depends_on: [engine]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  clearinghouse:
    profiles: [network]
    image: ${REGISTRY}/${ORG}/livepeer-clearinghouse:${PROVIDER_REF}
    build:
      context: https://github.com/${PROVIDER_REPO}.git#${PROVIDER_REF}
      dockerfile: examples/compose/Dockerfile
    command: [serve, --config-file, /etc/clearinghouse.toml]
    environment:
      CLEARINGHOUSE_ENABLE_ONCHAIN_LISTENER: ${BATTERIES_ONCHAIN_LISTENER:-false}
      CLEARINGHOUSE_SIGNER_ADDRESSES: ${PAYER_ADDRESS:-}
      CLEARINGHOUSE_RPC_URL_FILE: /run/secrets/rpc-url
    volumes:
      - paid-state:/data
      - ./config/clearinghouse.toml:/etc/clearinghouse.toml:ro
      - ./secrets:/run/secrets:ro
    healthcheck: { test: [CMD, curl, -fsS, http://127.0.0.1:8081/readyz], interval: 5s, retries: 12 }
    restart: unless-stopped

  signer:
    profiles: [network]
    image: ${REGISTRY}/${ORG}/livepeer-signer:${SIGNER_REF}
    build:
      context: https://github.com/livepeer/node.git#${SIGNER_REF}
      dockerfile: docker/Dockerfile
    network_mode: service:clearinghouse
    entrypoint: ["/usr/local/bin/livepeer-signer"]
    command: [--data-dir, /data/node, --config, /etc/signer.toml]
    volumes:
      - paid-state:/data
      - ./config/signer.toml:/etc/signer.toml:ro
      - ./secrets:/run/secrets:ro
    depends_on: { clearinghouse: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  app-data:
  db-data:
  storage-data:
  engine-data:
  paid-state:
